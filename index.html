<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>сваг-машина</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
            color: white;
            height: 100vh;
        }

        /* Новый фон с автоматическим переключением */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            animation: moveBg 20s infinite alternate ease-in-out;
        }

        @keyframes moveBg {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        .bg-light {
            background-image: url('images/img.png');
            opacity: 1;
        }

        .bg-dark {
            background-image: url('images/img.jpg');
            opacity: 0;
        }

        body.dark-theme .bg-light {
            opacity: 0;
        }

        body.dark-theme .bg-dark {
            opacity: 1;
        }

        /* Стили для контента из старого сайта */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100%;
            position: relative;
            flex-direction: column;
        }

        .rectangle {
            width: 320px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            background-color: rgba(36, 36, 36, 0.8);
            overflow: hidden;
            position: relative;
            border-radius: 20px;
            z-index: 1;
            margin: 10px;
            backdrop-filter: blur(5px);
        }

        .avatar {
            width: 220px;
            height: 220px;
            border-radius: 1000px;
            margin: 0;
        }

        .social-links-rectangle {
            display: flex;
            gap: -10px;
        }

        .nickname {
            font-family: "Roboto", sans-serif;
            color: white;
            margin: 0;
            margin-bottom: -10px;
            font-size: 24px;
            margin-bottom: 20px;
        }

        .content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            gap: 20px;
            position: relative;
            z-index: 1;
        }

        .social-links {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .social-links a {
            margin: 0 7px;
        }

        .social-links img {
            width: 32px;
            height: 32px;
            transition: filter 0.2s ease-in-out;
            border-radius: 1000px;
        }

        .social-links img:hover {
            filter: blur(2px);
        }

        /* Частицы */
        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- Новый фон с автоматическим переключением -->
    <div class="bg-container bg-light"></div>
    <div class="bg-container bg-dark"></div>
    
    <!-- Частицы -->
    <div id="particles-js"></div>
    
    <!-- Контент из старого сайта -->
    <div class="container">
        <div class="rectangle">
            <div class="content">
                <a href='https://www.youtube.com/watch?v=dQw4w9WgXcQ&ab_channel=RickAstley' target='_blank'>
                    <img class='avatar' src="media/12.gif" alt='Avatar'>
                </a>
                <h1 class="nickname">Мура</h1>
                <div class="social-links social-links-rectangle">
                    <a href="https://github.com/machiroumi" target="_blank">
                        <img src="icons/github.svg" alt="Github">
                    </a>
                    <a href="https://t.me/muramukou" target="_blank">
                        <img src="icons/telegram.svg" alt="Telegram">
                    </a>
                    <a href="https://discord.gg/femq" target="_blank">
                        <img src="icons/fp.svg" alt="FP">
                    </a>
                  <!--  <a href='https://music.yandex.ru/users/satoyashimxs/playlists/3' target='_blank'>
                        <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Yandex_Music_icon.svg" alt="Yandex Music"> -->
                    </a>
                    <a href='https://discord.com/users/1237792155221753870' target='_blank'>
                        <img src="icons/discord.svg" alt="Discord">
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Автоматическое переключение темы каждые 5 секунд
        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
        }
        
        // Запускаем переключение каждые 5 секунд
        setInterval(toggleTheme, 5000);

        // Инициализация частиц
        particlesJS("particles-js", {
            "particles": {
                "number": {
                    "value": 80,
                    "density": {
                        "enable": true,
                        "value_area": 800
                    }
                },
                "color": {
                    "value": "#ffffff"
                },
                "shape": {
                    "type": "circle",
                    "stroke": {
                        "width": 0,
                        "color": "#000000"
                    }
                },
                "opacity": {
                    "value": 0.5,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 1,
                        "opacity_min": 0.1,
                        "sync": false
                    }
                },
                "size": {
                    "value": 3,
                    "random": true,
                    "anim": {
                        "enable": true,
                        "speed": 2,
                        "size_min": 0.1,
                        "sync": false
                    }
                },
                "line_linked": {
                    "enable": false
                },
                "move": {
                    "enable": true,
                    "speed": 1,
                    "direction": "none",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false,
                    "attract": {
                        "enable": true,
                        "rotateX": 600,
                        "rotateY": 1200
                    }
                }
            },
            "interactivity": {
                "detect_on": "window",
                "events": {
                    "onhover": {
                        "enable": true,
                        "mode": "grab"
                    },
                    "onclick": {
                        "enable": true,
                        "mode": "push"
                    },
                    "resize": true
                },
                "modes": {
                    "grab": {
                        "distance": 140,
                        "line_linked": {
                            "opacity": 1
                        }
                    },
                    "push": {
                        "particles_nb": 4
                    }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
